# Dependabot reads this file from the default branch (main).
# Version updates are validated on dev before a release promotes them to main.
# Python's custom .lock outputs require coordinated pip-compile regeneration;
# see docs/dependency-management.md. Media image pins are reviewed manually.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend-runtime:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Security fixes target the default branch. Do not set target-branch here.
  # A zero version-PR limit avoids duplicate scheduled updates against main;
  # it does not disable security updates or impose the version-update cooldown.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
